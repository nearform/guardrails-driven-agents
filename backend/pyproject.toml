[project]
name = "backend"
version = "1.0.0"
description = "A simple backend to track ledgers."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "litestar[piccolo,pydantic]>=2.24.0",
  "piccolo[postgres]>=1.34.0",
  "pydantic-settings>=2.0.0",
  "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "ruff>=0.15.20",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
force-sort-within-sections = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Collect only `test_*.py`, so `piccolo_conf_test.py` (the test Piccolo config) is
# not mistaken for a test module and imported during collection.
python_files = ["test_*.py"]
